[project]
name = "stac-pydantic-extensions"
version = "0.1.0"
description = "Pydantic data models for STAC extensions"
readme = "README.md"
requires-python = ">=3.13"
authors = [
  { name = "Shadi Boomi", email = "shadi.boomi@universite-paris-saclay.fr" }
]
dependencies = [
  "geojson-pydantic>=2.1.1",
  "pydantic>=2.13.4",
  "pyproj>=3.7.2",
  "stac-pydantic>=3.5.1",
]

[project.scripts]
stac-pydantic-extensions = "stac_pydantic_extensions:main"

[dependency-groups]
dev = [
  "jsonschema>=4.26.0",
  "pre-commit>=4.6.0",
  "pytest>=9.0.3",
  "pytest-cov>=7.1.0",
  "pytest-icdiff>=0.9",
  "requests>=2.34.2",
  "ruff>=0.15.13",
  "tombi>=0.11.5",
  "ty>=0.0.37",
]

[build-system]
requires = ["uv_build>=0.11.9,<0.12.0"]
build-backend = "uv_build"

[tool.ty.src]
include = ["src", "tests"]
exclude = [".venv"]

[tool.ty.environment]
python = ".venv"
